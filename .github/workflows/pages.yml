name: GitHub Pages
on:
  push:
    branches: [main]
    paths: ['website/**', 'assets/goldfish-logo.png', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**', 'assets/goldfish-logo.png', 'scripts/build-site.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
